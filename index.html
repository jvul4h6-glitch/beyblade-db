<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="陀螺零件庫">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
<title>陀螺零件庫</title>
<style>
:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --card2: #16213e;
  --accent: #e94560;
  --accent2: #0f3460;
  --text: #eee;
  --text2: #aaa;
  --border: #2a2a4a;
  --success: #4ecca3;
  --warning: #f0a500;
  --compare-btn-bg: #e94560;
  --compare-btn-text: #fff;
  --atk: #e94560;
  --def: #4ecca3;
  --sta: #5dade2;
  --dash: #f0a500;
  --burst: #af7ac5;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }

/* Header */
.header { background: var(--card); padding: 16px 16px 0; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); overflow: visible; }
.header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.header h1 span { font-size: 24px; }

/* Tabs */
.tabs { display: flex; gap: 0; margin: 0 -16px; border-top: 1px solid var(--border); }
.tab-btn { flex: 1; padding: 12px 16px; border: none; background: none; color: var(--text2); font-size: 15px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn:active { opacity: 0.7; }

/* Search Box */
.search-box { position: relative; margin-top: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; padding-bottom: 8px; }
.search-box .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: 0.5; z-index: 1; pointer-events: none; }
#searchInput { width: 100%; padding: 12px 16px 12px 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 16px; outline: none; box-sizing: border-box; display: block; flex: 1; }
#searchInput:focus { border-color: var(--accent); }

/* Filter bar */
.filter-bar { padding: 8px 16px; display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.filter-bar::-webkit-scrollbar { display: none; }
.filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--card2); color: var(--text2); font-size: 13px; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.row-filters { display: flex; gap: 8px; flex-wrap: wrap; }

/* Category Radio Buttons */
.cat-radio-group { display: flex; gap: 8px; flex-wrap: wrap; }
.cat-radio-label { cursor: pointer; }
.cat-radio-input { display: none; }
.cat-radio-span { display: inline-block; padding: 10px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--card2); color: var(--text2); font-size: 13px; transition: all 0.2s; }
.cat-radio-input:checked + .cat-radio-span { background: var(--accent); color: #fff; border-color: var(--accent); }
.cat-radio-label:active .cat-radio-span { opacity: 0.7; }

/* Sort select */
.sort-select { padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 13px; outline: none; cursor: pointer; }

/* Stats */
.stats { display: flex; gap: 12px; padding: 0 16px 8px; }
.stat { flex: 1; background: var(--card2); border-radius: 10px; padding: 10px; text-align: center; }
.stat .num { font-size: 22px; font-weight: 700; color: var(--accent); }
.stat .label { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* Grid */
.grid { padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

/* Card */
.card { background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); transition: transform 0.15s, border-color 0.2s; cursor: pointer; position: relative; }
.card:active { transform: scale(0.97); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.card.selected::after { content: '✓'; position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.card-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 48px; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-body { padding: 10px; }
.card-name { font-size: 14px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-name-sub { font-size: 11px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-cat { font-size: 11px; color: var(--accent); margin-top: 4px; }
.card-note { font-size: 11px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-series { font-size: 10px; color: var(--text2); background: var(--card2); padding: 2px 6px; border-radius: 6px; display: inline-block; margin-top: 4px; }

/* Stat bars */
.stat-bars { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
.stat-bar-row { display: flex; align-items: center; gap: 4px; font-size: 10px; }
.stat-bar-label { width: 26px; color: var(--text2); font-size: 9px; }
.stat-bar-track { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.stat-bar-val { width: 22px; text-align: right; font-size: 10px; color: var(--text2); }
.atk-bar { background: var(--atk); }
.def-bar { background: var(--def); }
.sta-bar { background: var(--sta); }
.dash-bar { background: var(--dash); }
.burst-bar { background: var(--burst); }

/* Owned checkbox */
.owned-check { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 12px; color: var(--success); cursor: pointer; }
.owned-check input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--success); cursor: pointer; }

/* FAB */
.fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(233,69,96,0.4); cursor: pointer; z-index: 200; border: none; transition: transform 0.15s; }
.fab:active { transform: scale(0.9); }

/* Compare floating bar */
.compare-bar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px); background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 20px; display: flex; align-items: center; gap: 12px; z-index: 250; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: transform 0.3s ease; font-size: 14px; white-space: nowrap; }
.compare-bar.show { transform: translateX(-50%) translateY(0); }
.compare-bar .compare-count { color: var(--accent); font-weight: 700; }
.compare-bar .compare-btn-go { padding: 8px 18px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
.compare-bar .compare-btn-clear { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text2); font-size: 13px; cursor: pointer; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; align-items: flex-end; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 24px; animation: slideUp 0.25s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-header h2 { font-size: 18px; }
.modal-close { font-size: 24px; cursor: pointer; color: var(--text2); padding: 4px; }

/* Form */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 16px; outline: none; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 80px; }

/* Photo */
.photo-area { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
.photo-area:hover { border-color: var(--accent); }
.photo-area .icon { font-size: 40px; margin-bottom: 8px; }
.photo-area .hint { font-size: 13px; color: var(--text2); }
.photo-area input { display: none; }
.photo-preview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 8px; margin-top: 10px; display: none; }

/* Buttons */
.btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
.btn:active { opacity: 0.8; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-danger { background: #dc3545; color: #fff; }
.btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
.btn-row { display: flex; gap: 10px; margin-top: 20px; }
.btn-row .btn { flex: 1; }

/* Detail Modal */
.detail-img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; background: var(--card2); margin-bottom: 16px; }
.detail-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.detail-name-en { font-size: 14px; color: var(--text2); margin-bottom: 8px; }
.detail-cat { display: inline-block; padding: 4px 12px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 13px; margin-bottom: 4px; }
.detail-series { display: inline-block; padding: 4px 12px; border-radius: 12px; background: var(--accent2); color: #fff; font-size: 13px; margin-bottom: 12px; }
.detail-note { font-size: 14px; color: var(--text2); line-height: 1.6; white-space: pre-wrap; }
.detail-date { font-size: 12px; color: var(--text2); margin-top: 16px; opacity: 0.6; }

/* Radar chart */
.radar-container { display: flex; justify-content: center; margin: 16px 0; }
.radar-container canvas { max-width: 280px; max-height: 280px; }

/* Detail stat table */
.detail-stats { width: 100%; margin: 12px 0; }
.detail-stats .stat-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.detail-stats .stat-row:last-child { border-bottom: none; }
.detail-stats .stat-name { width: 52px; font-size: 13px; color: var(--text2); }
.detail-stats .stat-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.detail-stats .stat-fill { height: 100%; border-radius: 4px; }
.detail-stats .stat-num { width: 32px; text-align: right; font-size: 14px; font-weight: 600; }

/* Compare modal */
.compare-table { width: 100%; margin: 12px 0; overflow-x: auto; }
.compare-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
.compare-table th { padding: 8px 6px; text-align: center; color: var(--text2); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
.compare-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); }
.compare-table td:first-child { text-align: left; font-weight: 600; color: var(--text); }
.compare-table tr:last-child td { border-bottom: none; }
.compare-color-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }

/* Radar compare */
.compare-radars { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 12px 0; }
.compare-radar-item { text-align: center; }
.compare-radar-item .radar-title { font-size: 12px; color: var(--text2); margin-bottom: 4px; font-weight: 600; }
.compare-radar-item canvas { width: 160px; height: 160px; }

/* Empty State */
.empty { text-align: center; padding: 60px 20px; }
.empty .icon { font-size: 64px; margin-bottom: 16px; }
.empty p { color: var(--text2); font-size: 14px; }

/* Toast */
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--card); color: var(--text); padding: 12px 24px; border-radius: 12px; font-size: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 400; transition: transform 0.3s ease; border: 1px solid var(--border); }
.toast.show { transform: translateX(-50%) translateY(0); }

/* Install Banner */
.install-banner { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card2); padding: 12px 16px; border-top: 1px solid var(--border); z-index: 150; align-items: center; gap: 12px; font-size: 13px; }
.install-banner.show { display: flex; }
.install-banner button { padding: 8px 16px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.install-banner .close-banner { background: none; color: var(--text2); font-size: 18px; padding: 4px 8px; }

/* Logo */
.logo { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 6px; }

/* Backup Bar */
.backup-bar { display: flex; gap: 8px; padding: 8px 0 0; justify-content: flex-end; }
.backup-btn { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--card2); color: var(--text2); font-size: 12px; cursor: pointer; transition: all 0.2s; }
.backup-btn:active { opacity: 0.6; }

/* Tab content */
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Section title */
.section-title { font-size: 15px; font-weight: 700; padding: 12px 16px 4px; color: var(--text2); }

/* Owned filter row */
.owned-filter-row { display: flex; gap: 8px; padding: 8px 16px; }
.owned-filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--card2); color: var(--text2); font-size: 13px; cursor: pointer; transition: all 0.2s; }
.owned-filter-btn.active { background: var(--success); color: #fff; border-color: var(--success); }

/* Responsive */
@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1><img class="logo" src="./logo.jpg" alt="logo"> 陀螺零件庫</h1>
  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="encyclopedia">📖 圖鑑</button>
    <button class="tab-btn" data-tab="warehouse">📦 我的倉庫</button>
  </div>
</div>

<!-- Tab: Encyclopedia (圖鑑) -->
<div class="tab-content active" id="tab-encyclopedia">
  <!-- Filters row 1: series -->
  <div class="filter-bar" id="encSeriesFilters">
    <div class="filter-btn active" data-series="all">全部</div>
    <div class="filter-btn" data-series="BX">BX</div>
    <div class="filter-btn" data-series="UX">UX</div>
    <div class="filter-btn" data-series="CX">CX</div>
    <div class="filter-btn" data-series="其他">其他</div>
  </div>
  <!-- Filters row 2: type + search + sort -->
  <div class="filter-bar" id="encTypeFilters">
    <div class="filter-btn active" data-type="all">全部類型</div>
    <div class="filter-btn" data-type="blade">刃 (Blade)</div>
    <div class="filter-btn" data-type="ratchet">固鎖 (Ratchet)</div>
    <div class="filter-btn" data-type="bit">軸心 (Bit)</div>
    <div style="flex:1"></div>
    <select class="sort-select" id="encSort">
      <option value="default">預設排序</option>
      <option value="attack">⚔️ 攻擊</option>
      <option value="defense">🛡️ 防禦</option>
      <option value="stamina">💨 持久</option>
      <option value="dash">⚡ 加速</option>
      <option value="burst">💥 耐久</option>
      <option value="name">🔤 名稱</option>
    </select>
  </div>
  <!-- Search -->
  <div class="search-box" style="margin:0;padding:0 16px 8px;">
    <span class="search-icon">🔍</span>
    <input type="text" id="encSearchInput" placeholder="搜尋名稱或代號...">
  </div>
  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="num" id="encTotalCount">0</div><div class="label">顯示中</div></div>
    <div class="stat"><div class="num" id="encSelectedCount">0</div><div class="label">已選比較</div></div>
  </div>
  <div id="compareBar" class="compare-bar">
    <span>已選 <span class="compare-count" id="compareCountText">0</span> 個零件</span>
    <button class="compare-btn-clear" id="compareClearBtn">清除</button>
    <button class="compare-btn-go" id="compareGoBtn">🔍 比較</button>
  </div>
  <!-- Grid -->
  <div class="grid" id="encGrid"></div>
</div>

<!-- Tab: Warehouse (我的倉庫) -->
<div class="tab-content" id="tab-warehouse">
  <div class="search-box" style="margin:0;padding:12px 16px 8px;">
    <span class="search-icon">🔍</span>
    <input type="text" id="whSearchInput" placeholder="搜尋零件名稱、代號、備註...">
  </div>
  <!-- Warehouse filters -->
  <div class="filter-bar" id="whCatFilters">
    <div class="filter-btn active" data-cat="all">全部</div>
    <div class="filter-btn" data-cat="blade">刃 (Blade)</div>
    <div class="filter-btn" data-cat="lock">固鎖 (Lock)</div>
    <div class="filter-btn" data-cat="driver">軸心 (Driver)</div>
    <div class="filter-btn" data-cat="other">其他</div>
  </div>
  <!-- Sub-filters -->
  <div class="filter-bar" id="whSubFilters" style="display:none;"></div>
  <!-- Owned filter -->
  <div class="owned-filter-row">
    <div class="owned-filter-btn active" data-owned="all">全部</div>
    <div class="owned-filter-btn" data-owned="yes">☑️ 已擁有</div>
    <div class="owned-filter-btn" data-owned="no">☐ 未擁有</div>
  </div>
  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="num" id="whTotalCount">0</div><div class="label">總零件</div></div>
    <div class="stat"><div class="num" id="whOwnedCount">0</div><div class="label">已擁有</div></div>
    <div class="stat"><div class="num" id="whBladeCount">0</div><div class="label">刃</div></div>
    <div class="stat"><div class="num" id="whLockCount">0</div><div class="label">固鎖</div></div>
    <div class="stat"><div class="num" id="whDriverCount">0</div><div class="label">軸心</div></div>
  </div>
  <!-- Backup -->
  <div class="backup-bar">
    <button class="backup-btn" id="backupBtn" title="備份資料">📥 備份</button>
    <button class="backup-btn" id="restoreBtn" title="匯入資料">📤 匯入</button>
    <input type="file" id="restoreInput" accept=".json" style="display:none">
  </div>
  <!-- Grid -->
  <div class="grid" id="whGrid"></div>
  <!-- Empty State -->
  <div class="empty" id="whEmpty" style="display:none;">
    <div class="icon">📦</div>
    <p>還沒有零件<br>點右下角 + 開始新增</p>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn">+</button>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">新增零件</h2>
      <span class="modal-close" id="modalClose">✕</span>
    </div>
    <form id="partForm">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>📷 照片</label>
        <div class="photo-area" id="photoArea">
          <div class="icon">📸</div>
          <div class="hint">點擊拍照或從相簿選擇</div>
          <input type="file" id="photoInput" accept="image/*" capture="environment">
          <img class="photo-preview" id="photoPreview">
        </div>
      </div>
      <div class="form-group">
        <label>🔢 代號 *</label>
        <input type="text" id="partCode" placeholder="例如：CX-04、3-80、J" required>
      </div>
      <div class="form-group">
        <label>🏷️ 零件名稱</label>
        <input type="text" id="partName" placeholder="例如：翔空、九尾、Point">
      </div>
      <div class="form-group">
        <label>📂 分類</label>
        <div class="cat-radio-group" id="catRadioGroup">
          <label class="cat-radio-label">
            <input type="radio" name="catRadio" value="blade" class="cat-radio-input" checked>
            <span class="cat-radio-span">刃 (Blade)</span>
          </label>
          <label class="cat-radio-label">
            <input type="radio" name="catRadio" value="lock" class="cat-radio-input">
            <span class="cat-radio-span">固鎖 (Lock)</span>
          </label>
          <label class="cat-radio-label">
            <input type="radio" name="catRadio" value="driver" class="cat-radio-input">
            <span class="cat-radio-span">軸心 (Driver)</span>
          </label>

<script>
// ===== IndexedDB =====
const DB_NAME = 'BeybladePartsDB';
const DB_VERSION = 2;
const STORE_NAME = 'parts';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        store.createIndex('cat', 'cat', { unique: false });
        store.createIndex('name', 'name', { unique: false });
        store.createIndex('created', 'created', { unique: false });
        store.createIndex('owned', 'owned', { unique: false });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}

function getAllParts() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function addPart(part) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    part.created = Date.now();
    if (part.owned === undefined) part.owned = true;
    const req = store.add(part);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function updatePart(part) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.put(part);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function deletePart(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ===== DOM helpers =====
function escHtml(s) {
  if (s == null) return '';
  const d = document.createElement('d');
  d.textContent = s;
  return d.innerHTML;
}

function getCatEmoji(cat) {
  const map = { blade: '⚔️', lock: '🔒', driver: '⚙️', other: '📦', ratchet: '🔒', bit: '⚙️' };
  return map[cat] || '📦';
}

function getCatLabel(cat) {
  const map = { blade: '刃 (Blade)', lock: '固鎖 (Lock)', driver: '軸心 (Driver)', other: '其他', ratchet: '固鎖 (Ratchet)', bit: '軸心 (Bit)' };
  return map[cat] || '其他';
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ===== State =====
let allParts = [];
let partsDB = null;
let currentTab = 'encyclopedia';

// Encyclopedia state
let encSeriesFilter = 'all';
let encTypeFilter = 'all';
let encSearch = '';
let encSortBy = 'default';
let encSelectedIds = new Set();

// Warehouse state
let whCatFilter = 'all';
let whSubFilter = '';
let whSearch = '';
let whOwnedFilter = 'all';
let detailId = null;
let deferredPrompt = null;

// ===== Load PartsDB =====
async function loadPartsDB() {
  if (partsDB) return partsDB;
  try {
    const resp = await fetch('parts-db.json');
    partsDB = await resp.json();
    return partsDB;
  } catch(e) {
    console.error('Failed to load parts DB:', e);
    // Fallback to parts.json
    try {
      const resp = await fetch('parts.json');
      partsDB = await resp.json();
      return partsDB;
    } catch(e2) {
      console.error('Failed to load fallback parts DB:', e2);
      return { blade: [], ratchet: [], bit: [] };
    }
  }
}

// Flatten partsDB into a single array with type info
function flatPartsDB() {
  if (!partsDB) return [];
  const result = [];
  if (partsDB.blade) for (const p of partsDB.blade) result.push({ ...p, _dbType: 'blade', _typeLabel: '刃' });
  if (partsDB.ratchet) for (const p of partsDB.ratchet) result.push({ ...p, _dbType: 'ratchet', _typeLabel: '固鎖' });
  if (partsDB.bit) for (const p of partsDB.bit) result.push({ ...p, _dbType: 'bit', _typeLabel: '軸心' });
  return result;
}

function getPartSeries(part) {
  const s = part.series || part.group || '';
  if (s === 'BX' || s === 'UX' || s === 'CX') return s;
  return '其他';
}

// ===== Radar Chart (Canvas 2D) =====
function drawRadarCanvas(canvas, part, size) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2;
  const R = size * 0.38;
  const r = size * 0.04;
  const labels = ['攻擊', '防禦', '持久', '加速', '耐久'];
  const colors = ['#e94560', '#4ecca3', '#5dade2', '#f0a500', '#af7ac5'];
  const values = [
    part.attack || 0,
    part.defense || 0,
    part.stamina || 0,
    part.dash || 0,
    part.burst || 0
  ];
  const maxVal = 70;
  const n = 5;
  const angleStep = (Math.PI * 2) / n;
  const startAngle = -Math.PI / 2;

  // Clear
  ctx.clearRect(0, 0, size, size);

  // Background circles
  for (let level = 1; level <= 4; ctx.strokeStyle = `rgba(255,255,255,${0.04 + level * 0.02})`, level++) {
    const lr = R * level / 4;
    ctx.beginPath();
    ctx.arc(cx, cy, lr, 0, Math.PI * 2);
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Axis lines
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < n; i++) {
    const angle = startAngle + i * angleStep;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * R, cy + Math.sin(angle) * R);
    ctx.stroke();
  }

  // Data polygon fill
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const angle = startAngle + i * angleStep;
    const v = Math.min(values[i] / maxVal, 1);
    const x = cx + Math.cos(angle) * R * v;
    const y = cy + Math.sin(angle) * R * v;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = `${colors[0]}22`;
  ctx.fill();

  // Data polygon stroke
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const angle = startAngle + i * angleStep;
    const v = Math.min(values[i] / maxVal, 1);
    const x = cx + Math.cos(angle) * R * v;
    const y = cy + Math.sin(angle) * R * v;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = colors[0];
  ctx.lineWidth = 2;
  ctx.stroke();

  // Data points
  for (let i = 0; i < n; i++) {
    const angle = startAngle + i * angleStep;
    const v = Math.min(values[i] / maxVal, 1);
    const x = cx + Math.cos(angle) * R * v;
    const y = cy + Math.sin(angle) * R * v;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.7, 0, Math.PI * 2);
    ctx.fillStyle = colors[i];
    ctx.fill();
  }

  // Labels
  ctx.font = `${Math.max(10, size * 0.055)}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const angle = startAngle + i * angleStep;
    const lx = cx + Math.cos(angle) * (R + size * 0.1);
    const ly = cy + Math.sin(angle) * (R + size * 0.1);
    ctx.fillStyle = colors[i];
    ctx.fillText(labels[i], lx, ly);
  }
}

// Draw multi-part radar comparison
function drawCompareRadar(canvas, parts, size) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2;
  const R = size * 0.38;
  const labels = ['攻擊', '防禦', '持久', '加速', '耐久'];
  const statKeys = ['attack', 'defense', 'stamina', 'dash', 'burst'];
  const partColors = ['#e94560', '#4ecca3', '#5dade2', '#f0a500', '#af7ac5', '#ff6b9d', '#00d2ff', '#ffd93d'];
  const maxVal = 70;
  const n = 5;
  const angleStep = (Math.PI * 2) / n;
  const startAngle = -Math.PI / 2;

  ctx.clearRect(0, 0, size, size);

  // Background
  for (let level = 1; level <= 4; level++) {
    const lr = R * level / 4;
    ctx.beginPath();
    ctx.arc(cx, cy, lr, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${0.04 + level * 0.02})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Axis
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < n; i++) {
    const angle = startAngle + i * angleStep;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * R, cy + Math.sin(angle) * R);
    ctx.stroke();
  }

  // Labels
  ctx.font = `bold ${Math.max(10, size * 0.055)}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const labelColors = ['#e94560', '#4ecca3', '#5dade2', '#f0a500', '#af7ac5'];
  for (let i = 0; i < n; i++) {
    const angle = startAngle + i * angleStep;
    const lx = cx + Math.cos(angle) * (R + size * 0.1);
    const ly = cy + Math.sin(angle) * (R + size * 0.1);
    ctx.fillStyle = labelColors[i];
    ctx.fillText(labels[i], lx, ly);
  }

  // Each part
  for (let pi = 0; pi < parts.length; pi++) {
    const part = parts[pi];
    const color = partColors[pi % partColors.length];
    const values = statKeys.map(k => part[k] || 0);

    // Fill
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const angle = startAngle + i * angleStep;
      const v = Math.min(values[i] / maxVal, 1);
      const x = cx + Math.cos(angle) * R * v;
      const y = cy + Math.sin(angle) * R * v;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = color + '18';
    ctx.fill();

    // Stroke
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const angle = startAngle + i * angleStep;
      const v = Math.min(values[i] / maxVal, 1);
      const x = cx + Math.cos(angle) * R * v;
      const y = cy + Math.sin(angle) * R * v;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// ===== Stats bar HTML =====
function statBarHtml(label, value, cls, color) {
  const pct = Math.min((value / 70) * 100, 100);
  return `<div class="stat-bar-row">
    <span class="stat-bar-label">${label}</span>
    <div class="stat-bar-track"><div class="stat-bar-fill ${cls}" style="width:${pct}%;background:${color}"></div></div>
    <span class="stat-bar-val">${value}</span>
  </div>`;
}

// ===== Encyclopedia Tab =====
function renderEncyclopedia() {
  const allDB = flatPartsDB();
  let parts = allDB;

  // Series filter
  if (encSeriesFilter !== 'all') {
    parts = parts.filter(p => getPartSeries(p) === encSeriesFilter);
  }

  // Type filter
  if (encTypeFilter !== 'all') {
    parts = parts.filter(p => p._dbType === encTypeFilter);
  }

  // Search
  if (encSearch) {
    const q = encSearch.toLowerCase();
    parts = parts.filter(p => {
      const searchable = [p.name, p.code, p.eng, p.jap, ...(p.names || [])].join(' ').toLowerCase();
      return searchable.includes(q);
    });
  }

  // Sort
  if (encSortBy === 'attack') parts.sort((a, b) => (b.attack || 0) - (a.attack || 0));
  else if (encSortBy === 'defense') parts.sort((a, b) => (b.defense || 0) - (a.defense || 0));
  else if (encSortBy === 'stamina') parts.sort((a, b) => (b.stamina || 0) - (a.stamina || 0));
  else if (encSortBy === 'dash') parts.sort((a, b) => (b.dash || 0) - (a.dash || 0));
  else if (encSortBy === 'burst') parts.sort((a, b) => (b.burst || 0) - (a.burst || 0));
  else if (encSortBy === 'name') parts.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

  // Stats
  document.getElementById('encTotalCount').textContent = allDB.length;
  document.getElementById('encSelectedCount').textContent = encSelectedIds.size;

  // Compare bar
  const compareBar = document.getElementById('compareBar');
  if (encSelectedIds.size >= 2) {
    compareBar.classList.add('show');
    document.getElementById('compareCountText').textContent = encSelectedIds.size;
  } else {
    compareBar.classList.remove('show');
  }

  const grid = document.getElementById('encGrid');
  if (parts.length === 0) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1;"><div class="icon">🔍</div><p>找不到零件</p></div>';
    grid.style.display = 'grid';
    return;
  }
  grid.style.display = 'grid';

  grid.innerHTML = parts.map(p => {
    const code = escHtml(p.code || '');
    const name = escHtml(p.name || '');
    const engName = escHtml(p.eng || '');
    const series = escHtml(getPartSeries(p));
    const typeLabel = escHtml(p._typeLabel || '');
    const isSelected = encSelectedIds.has(p._dbType + ':' + p.code);
    const cardClass = isSelected ? 'card selected' : 'card';

    return `
      <div class="${cardClass}" data-dbtype="${escHtml(p._dbType)}" data-code="${code}" data-series="${series}">
        <div class="card-body">
          <div class="card-name">${name}</div>
          ${engName ? `<div class="card-name-sub">${engName}</div>` : ''}
          <div class="card-cat">${typeLabel} · ${code}</div>
          <div class="card-series">${series}</div>
          <div class="stat-bars">
            ${statBarHtml('攻', p.attack || 0, 'atk-bar', '#e94560')}
            ${statBarHtml('防', p.defense || 0, 'def-bar', '#4ecca3')}
            ${statBarHtml('持', p.stamina || 0, 'sta-bar', '#5dade2')}
            ${statBarHtml('速', p.dash || 0, 'dash-bar', '#f0a500')}
            ${statBarHtml('爆', p.burst || 0, 'burst-bar', '#af7ac5')}
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Card click
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      const dbType = card.dataset.dbtype;
      const code = card.dataset.code;
      const key = dbType + ':' + code;

      // Check if Ctrl/Cmd held for comparison
      if (e.ctrlKey || e.metaKey) {
        if (encSelectedIds.has(key)) {
          encSelectedIds.delete(key);
        } else {
          if (encSelectedIds.size < 8) {
            encSelectedIds.add(key);
          } else {
            showToast('最多比較 8 個零件');
          }
        }
        renderEncyclopedia();
      } else {
        // Show detail modal
        showEncDetail(dbType, code);
      }
    });
  });
}

function showEncDetail(dbType, code) {
  const part = partsDB[dbType]?.find(p => p.code === code);
  if (!part) return;

  const modal = document.getElementById('encDetailModal');
  const content = document.getElementById('encDetailContent');
  const series = getPartSeries(part);

  content.innerHTML = `
    <div class="detail-name">${escHtml(part.name)}</div>
    ${part.eng ? `<div class="detail-name-en">${escHtml(part.eng)}${part.jap ? ' · ' + escHtml(part.jap) : ''}</div>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <span class="detail-cat">${escHtml(part._typeLabel || getCatLabel(dbType))}</span>
      <span class="detail-series">${escHtml(series)}</span>
      <span class="detail-series" style="background:var(--card2);color:var(--text2);">${escHtml(part.code)}</span>
    </div>
    <div class="radar-container"><canvas id="encRadarCanvas"></canvas></div>
    <table class="detail-stats">
      <div class="stat-row"><span class="stat-name">⚔️ 攻擊</span><div class="stat-track"><div class="stat-fill" style="width:${(part.attack||0)/70*100}%;background:#e94560"></div></div><span class="stat-num">${part.attack||0}</span></div>
      <div class="stat-row"><span class="stat-name">🛡️ 防禦</span><div class="stat-track"><div class="stat-fill" style="width:${(part.defense||0)/70*100}%;background:#4ecca3"></div></div><span class="stat-num">${part.defense||0}</span></div>
      <div class="stat-row"><span class="stat-name">💨 持久</span><div class="stat-track"><div class="stat-fill" style="width:${(part.stamina||0)/70*100}%;background:#5dade2"></div></div><span class="stat-num">${part.stamina||0}</span></div>
      <div class="stat-row"><span class="stat-name">⚡ 加速</span><div class="stat-track"><div class="stat-fill" style="width:${(part.dash||0)/70*100}%;background:#f0a500"></div></div><span class="stat-num">${part.dash||0}</span></div>
      <div class="stat-row"><span class="stat-name">💥 耐久</span><div class="stat-track"><div class="stat-fill" style="width:${(part.burst||0)/70*100}%;background:#af7ac5"></div></div><span class="stat-num">${part.burst||0}</span></div>
    </table>
    ${part.desc ? `<div class="detail-note">${escHtml(part.desc)}</div>` : ''}
  `;

  modal.classList.add('show');

  // Draw radar after modal is visible
  requestAnimationFrame(() => {
    const canvas = document.getElementById('encRadarCanvas');
    if (canvas) {
      const size = Math.min(280, window.innerWidth - 80);
      drawRadarCanvas(canvas, part, size);
    }
  });
}

// ===== Compare =====
function showCompare() {
  const allDB = flatPartsDB();
  const selected = [];
  for (const key of encSelectedIds) {
    const [dbType, code] = key.split(':');
    const part = partsDB[dbType]?.find(p => p.code === code);
    if (part) selected.push({ ...part, _dbType: dbType });
  }
  if (selected.length < 2) { showToast('請選擇至少 2 個零件'); return; }

  const modal = document.getElementById('compareModal');
  const content = document.getElementById('compareContent');
  const statKeys = ['attack', 'defense', 'stamina', 'dash', 'burst'];
  const statLabels = ['⚔️ 攻擊', '🛡️ 防禦', '💨 持久', '⚡ 加速', '💥 耐久'];
  const colors = ['#e94560', '#4ecca3', '#5dade2', '#f0a500', '#af7ac5', '#ff6b9d', '#00d2ff', '#ffd93d'];

  let tableHtml = '<div class="compare-table"><table><thead><tr><th>零件</th>';
  for (const p of selected) {
    tableHtml += `<th><span class="compare-color-dot" style="background:${colors[selected.indexOf(p) % colors.length]}"></span>${escHtml(p.name.length > 8 ? p.name.slice(0, 8) + '…' : p.name)}</th>`;
  }
  tableHtml += '</tr></thead><tbody>';
  for (let si = 0; si < statKeys.length; si++) {
    const key = statKeys[si];
    tableHtml += `<tr><td>${statLabels[si]}</td>`;
    // Find max for highlighting
    const maxVal = Math.max(...selected.map(p => p[key] || 0));
    for (const p of selected) {
      const val = p[key] || 0;
      const isMax = val === maxVal && val > 0;
      tableHtml += `<td style="${isMax ? 'color:' + colors[statKeys.indexOf(key)] + ';font-weight:700;' : ''}">${val}</td>`;
    }
    tableHtml += '</tr>';
  }
  tableHtml += '</tbody></table></div>';

  // Radar comparison
  tableHtml += '<div class="radar-container"><canvas id="compareRadarCanvas"></canvas></div>';

  // Legend

// ===== Warehouse Tab =====
function renderWarehouse() {
  let parts = allParts;

  // Category filter
  if (whCatFilter !== 'all') {
    parts = parts.filter(p => p.cat === whCatFilter);
  }

  // Sub-filter
  if (whSubFilter) {
    parts = parts.filter(p => (p.code || '').toUpperCase() === whSubFilter.toUpperCase());
  }

  // Owned filter
  if (whOwnedFilter === 'yes') parts = parts.filter(p => p.owned);
  else if (whOwnedFilter === 'no') parts = parts.filter(p => !p.owned);

  // Search
  if (whSearch) {
    const q = whSearch.toLowerCase();
    parts = parts.filter(p =>
      (p.name || '').toLowerCase().includes(q) ||
      (p.code || '').toLowerCase().includes(q) ||
      (p.note || '').toLowerCase().includes(q)
    );
  }

  // Sort
  parts.sort((a, b) => (b.created || 0) - (a.created || 0));

  // Stats
  document.getElementById('whTotalCount').textContent = allParts.length;
  document.getElementById('whOwnedCount').textContent = allParts.filter(p => p.owned).length;
  document.getElementById('whBladeCount').textContent = allParts.filter(p => p.cat === 'blade').length;
  document.getElementById('whLockCount').textContent = allParts.filter(p => p.cat === 'lock').length;
  document.getElementById('whDriverCount').textContent = allParts.filter(p => p.cat === 'driver').length;

  const grid = document.getElementById('whGrid');
  const empty = document.getElementById('whEmpty');

  // Build sub-filters
  buildWhSubFilters();

  if (parts.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  grid.style.display = 'grid';
  empty.style.display = 'none';

  grid.innerHTML = parts.map(p => {
    const imgHtml = p.photo
      ? `<img src="${p.photo}" alt="${escHtml(p.name)}" loading="lazy">`
      : `<span>${getCatEmoji(p.cat)}</span>`;
    const codeHtml = p.code ? `<div class="db-item-code">${escHtml(p.code)}</div>` : '';
    const ownedChecked = p.owned ? 'checked' : '';
    return `
      <div class="card" data-id="${p.id}">
        <div class="card-img">${imgHtml}</div>
        <div class="card-body">
          <div class="card-name">${escHtml(p.name)}</div>
          <div class="card-cat">${getCatLabel(p.cat)}</div>
          ${codeHtml}
          ${p.note ? `<div class="card-note">${escHtml(p.note)}</div>` : ''}
          <label class="owned-check" onclick="event.stopPropagation()">
            <input type="checkbox" ${ownedChecked} onchange="toggleOwned(${p.id}, this.checked)">
            擁有
          </label>
        </div>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => showWhDetail(parseInt(card.dataset.id)));
  });
}

async function toggleOwned(id, owned) {
  const part = allParts.find(p => p.id === id);
  if (!part) return;
  part.owned = owned;
  await updatePart(part);
  renderWarehouse();
}

function buildWhSubFilters() {
  const subFilters = document.getElementById('whSubFilters');
  if (!subFilters) return;

  if (whCatFilter !== 'lock' && whCatFilter !== 'driver') {
    subFilters.style.display = 'none';
    whSubFilter = '';
    return;
  }

  let allCodes = [];
  if (whCatFilter === 'lock') {
    allCodes = (partsDB?.ratchet || []).map(r => r.code).filter(Boolean);
  } else if (whCatFilter === 'driver') {
    allCodes = (partsDB?.bit || []).map(b => b.code).filter(Boolean);
  }

  const catParts = allParts.filter(p => p.cat === whCatFilter);
  const codeCount = {};
  for (const p of catParts) {
    const code = (p.code || '').toUpperCase();
    if (code) codeCount[code] = (codeCount[code] || 0) + 1;
  }

  allCodes = allCodes.sort((a, b) => {
    const hasA = (codeCount[a] || 0) > 0 ? 0 : 1;
    const hasB = (codeCount[b] || 0) > 0 ? 0 : 1;
    if (hasA !== hasB) return hasA - hasB;
    return a.localeCompare(b);
  });

  if (allCodes.length === 0) {
    subFilters.style.display = 'none';
    whSubFilter = '';
    return;
  }

  subFilters.style.display = 'flex';
  let html = `<div class="filter-btn${whSubFilter === '' ? ' active' : ''}" data-sub="">全部</div>`;
  for (const code of allCodes) {
    const count = codeCount[code] || 0;
    const active = whSubFilter === code ? ' active' : '';
    const dimmed = count === 0 ? ' style="opacity:0.45;"' : '';
    html += `<div class="filter-btn${active}" data-sub="${escHtml(code)}"${dimmed}>${escHtml(code)} <span style="opacity:0.6;font-size:11px;">(${count})</span></div>`;
  }
  subFilters.innerHTML = html;

  subFilters.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      subFilters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      whSubFilter = btn.dataset.sub;
      renderWarehouse();
    });
  });
}

  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 600;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const preview = document.getElementById('photoPreview');
      preview.src = dataUrl;
      preview.style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// Backup / Restore
async function doBackup() {
  if (!allParts.length) { showToast('沒有資料可備份'); return; }
  const data = JSON.stringify(allParts, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `beyblade-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`✅ 已備份 ${allParts.length} 筆資料`);
}

async function doRestore(file) {
  try {
    const text = await file.text();
    const parts = JSON.parse(text);
    if (!Array.isArray(parts) || !parts.length) { showToast('❌ 檔案格式錯誤'); return; }

    if (allParts.length > 0) {
      if (!confirm(`目前有 ${allParts.length} 筆資料，匯入將覆蓋全部 ${parts.length} 筆資料。確定繼續？`)) return;
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).clear();
      await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
    }

    for (let i = 0; i < parts.length; i += 50) {
      const batch = parts.slice(i, i + 50);
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      for (const part of batch) {
        const { id, ...rest } = part;
        store.add(rest);
      }
      await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
    }

    allParts = await getAllParts();
    showToast(`✅ 已匯入 ${parts.length} 筆資料`);
    document.getElementById('formModal').classList.remove('show');
    document.getElementById('detailModal').classList.remove('show');
    renderWarehouse();
  } catch (err) {
    console.error(err);
    showToast('❌ 匯入失敗：' + (err.message || '檔案格式錯誤'));
  }
}

document.getElementById('backupBtn').addEventListener('click', doBackup);
document.getElementById('restoreBtn').addEventListener('click', () => document.getElementById('restoreInput').click());

  const file = e.target.files[0];
  if (file) {

  }
});
